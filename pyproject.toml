[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dorkforge"
version = "1.0.0"
description = "One dork DSL compiled to Google, GitHub or Shodan syntax, with a validation gate and 50 validated skills."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wsh7Ash" }]
keywords = ["dork", "osint", "bug-bounty", "recon", "google", "shodan"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
dorkforge = "dorkforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
